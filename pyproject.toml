[project]
name = "ai-incident-copilot"
version = "0.1.0"
description = "AI-assisted incident response backend built with FastAPI"
readme = "README.md"
requires-python = ">=3.12,<3.14"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
